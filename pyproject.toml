[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmem-local"
version = "0.1.0"
description = "Project-scoped memory and work tracking exposed as a local Codex MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
agentmem = "agentmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
